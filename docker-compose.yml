services:
  mysql:
    image: mysql:8.0
    container_name: nexswap-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: nexswap
      MYSQL_USER: nexswap
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD before starting MySQL}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD before starting MySQL}
    ports:
      - "3306:3306"
    volumes:
      - nexswap-mysql-data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  nexswap-mysql-data:
